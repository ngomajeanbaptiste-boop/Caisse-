<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d5a3c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Caisse Épicerie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: comptoir d'épicerie — barre latérale vert forêt, plan de travail clair, accent mangue réservé à l'action d'encaisser */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#e8eee5; --line:#d5ddd1;
  --fg:#15241b; --muted:#5a6a5f;
  --brand:#1d5a3c; --brand-fg:#ffffff; --brand-soft:#dcebe1;
  --accent:#e9a21a; --accent-fg:#2a1c00;
  --ok:#2b8a4e; --warn:#b97406; --bad:#c13e2b;
  --ok-soft:#dff1e5; --warn-soft:#fbefd6; --bad-soft:#f8e1dc;
  --paper:#fffdf5; --paper-fg:#1d1d1a;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Courier New", monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1611; --surface:#16211a; --surface-2:#1d2a22; --line:#2a3a30;
  --fg:#e6eee8; --muted:#94a499;
  --brand:#5cbd88; --brand-fg:#06170d; --brand-soft:#1d3a2a;
  --accent:#f0b43c; --accent-fg:#231700;
  --ok:#5cc283; --warn:#e8a83c; --bad:#ef7562;
  --ok-soft:#1b3626; --warn-soft:#3a2d12; --bad-soft:#3d1f1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1611; --surface:#16211a; --surface-2:#1d2a22; --line:#2a3a30;
  --fg:#e6eee8; --muted:#94a499;
  --brand:#5cbd88; --brand-fg:#06170d; --brand-soft:#1d3a2a;
  --accent:#f0b43c; --accent-fg:#231700;
  --ok:#5cc283; --warn:#e8a83c; --bad:#ef7562;
  --ok-soft:#1b3626; --warn-soft:#3a2d12; --bad-soft:#3d1f1a;
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* Barre latérale */
.side{background:var(--brand);color:var(--brand-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding-block:20px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;overflow-y:auto}
:root:not([data-theme="light"]) .side{}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;flex:none}
.brand b{font-family:var(--f-display);display:block;font-size:1rem;line-height:1.15}
.brand small{opacity:.75;font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;opacity:.6;margin:12px 10px 4px}
.nav a{color:inherit;text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--brand-fg);color:var(--brand)}
.nav a .dot{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:.72rem;font-weight:700;display:grid;place-items:center}
.side .foot{margin-top:auto;font-size:.75rem;opacity:.7}

main{min-width:0;padding-block:24px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
@media (min-width:1000px){main{padding-left:28px;padding-right:max(28px, env(safe-area-inset-right, 0px))}}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

@media (max-width:999px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--brand)}
  .side{position:sticky;top:env(safe-area-inset-top, 0px);height:auto;z-index:9;flex-direction:column;gap:10px;padding-block:10px 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow:visible}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;padding-bottom:10px}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp,.side .foot{display:none}
  .nav a{padding:7px 12px;font-size:.9rem}
  .logo{width:32px;height:32px}
}

/* Éléments communs */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card > h2{margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.45rem;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:.82rem;color:var(--muted)}
.kpi.hl{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.kpi.hl .l,.kpi.hl .s{color:inherit;opacity:.8}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tr.off td{opacity:.5}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.neg{color:var(--bad)} .plus{color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=search],input[type=date],input[type=number],input:not([type]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.78rem;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;font-weight:500}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.period{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.period .dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:.9rem}

/* Caisse */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:1099px){.pos{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:899px){.pos{grid-template-columns:minmax(0,1fr)}}
.pos-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.searchbar{position:relative}
.searchbar input{width:100%;padding:13px 14px;font-size:1rem;border-radius:10px}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--muted);pointer-events:none}
@media (max-width:520px){.kbd{display:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:420px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:118px;transition:transform .08s,border-color .1s}
.tile:hover{border-color:var(--brand)}
.tile:active{transform:scale(.97)}
.tile.out{opacity:.45;cursor:not-allowed}
.t-cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.t-nom{font-weight:600;line-height:1.25;flex:1}
.t-px{font-family:var(--f-display);font-weight:700;font-size:1.08rem;color:var(--brand)}
.t-stk{font-size:.76rem;color:var(--muted)}
.t-stk.low{color:var(--warn);font-weight:600}
.t-badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-fg);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:.8rem;padding:0 6px}
.pos-r{background:var(--surface);border:1px solid var(--line);border-radius:12px;position:sticky;top:20px;display:flex;flex-direction:column;max-height:calc(100vh - 40px);min-width:0}
@media (max-width:999px){.pos-r{top:120px;max-height:none;position:static}}
.cart-h{display:flex;align-items:baseline;gap:10px;padding:16px 16px 10px;border-bottom:1px dashed var(--line)}
.cart-h .link{margin-left:auto}
.cart-lines{overflow-y:auto;padding:4px 16px;flex:1;min-height:80px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl-n{display:flex;flex-direction:column;min-width:0}
.cl-n b{font-weight:600;overflow-wrap:anywhere}
.cl-n span{font-size:.78rem}
.cl-t{font-weight:600;min-width:72px;text-align:right}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:30px;height:32px;cursor:pointer;font-size:1.05rem}
.qty input{width:42px;border:0;text-align:center;padding:4px;border-radius:0;background:var(--surface)}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:28px;height:28px;border-radius:6px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.cart-f{padding:14px 16px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:0 0 12px 12px}
.cart-f .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cart-f .row label{font-weight:500}
.in-sm{width:120px;text-align:right}
.row.total{font-family:var(--f-display);font-size:1.5rem;font-weight:700;padding:4px 0}
.row.rendu span:last-child{font-weight:700;font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;border:1px dashed var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:.82rem;font-weight:600}
.btn.big{padding:15px;font-size:1.08rem;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-family:var(--f-display)}
.note{margin:0;font-size:.85rem;color:var(--muted)}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--fg);color:var(--bg);padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;border:0;width:100%;cursor:pointer}
.mbar b{font-family:var(--f-display);font-size:1.15rem}
@media (min-width:900px){.mbar{display:none!important}}

/* Ticket de caisse */
.ticket{background:var(--paper);color:var(--paper-fg);font-family:var(--f-mono);font-size:.82rem;line-height:1.5;padding:18px 16px 22px;max-width:320px;margin:0 auto;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.12);position:relative}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px}
.ticket .c{text-align:center}
.ticket .t-name{font-weight:600;font-size:1rem;letter-spacing:.04em;text-transform:uppercase}
.ticket hr{border:0;border-top:1px dashed currentColor;opacity:.5;margin:8px 0}
.ticket .r{display:flex;justify-content:space-between;gap:10px}
.ticket .big{font-weight:600;font-size:1.05rem}
.ticket .void{text-align:center;font-weight:600;border:2px solid #b3261e;color:#b3261e;padding:2px;margin:6px 0;letter-spacing:.2em}

/* Graphiques */
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--brand);opacity:.85}
.chart .bar.today{fill:var(--accent);opacity:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hb .fil{height:100%;background:var(--brand);border-radius:5px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.li:last-child{border-bottom:0}
.li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* États financiers */
.stmt{width:100%;border-collapse:collapse;font-size:.95rem}
.stmt td{padding:8px 4px;border-bottom:1px solid var(--line);white-space:normal}
.stmt td:last-child{text-align:right;white-space:nowrap;padding-left:16px}
.stmt .sec td{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding-top:18px;border-bottom:2px solid var(--fg)}
.stmt .ind td:first-child{padding-left:16px}
.stmt .sub td{font-weight:700;background:var(--surface-2)}
.stmt .grand td{font-family:var(--f-display);font-weight:700;font-size:1.15rem;border-bottom:3px double var(--fg);padding-top:12px}
.stmt .grand.res td{background:var(--brand);color:var(--brand-fg);border-bottom:0;padding:12px 10px}

/* Fenêtres */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,14,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto 0}
.sheet.wide{max-width:760px}
.m-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ask{max-width:420px}
.alines{display:flex;flex-direction:column;gap:8px}
.aline{display:grid;grid-template-columns:minmax(0,1fr) 80px 110px 100px 28px;gap:8px;align-items:center}
@media (max-width:560px){.aline{grid-template-columns:minmax(0,1fr) 70px 90px 28px}.aline .at{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:60;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
@media (min-width:900px){.toast{bottom:28px}}
/* Scanner caméra */
.scanov{z-index:55;align-items:center;background:rgba(0,0,0,.85)}
.scanbox{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;color:#fff}
.scanv{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scanv video{width:100%;height:100%;object-fit:cover;display:block}
.scanv::after{content:"";position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanv .laser{position:absolute;left:14%;right:14%;top:50%;height:2px;background:#ff4d3a;z-index:2;box-shadow:0 0 8px #ff4d3a}
#scanMsg{font-weight:600;text-align:center;min-height:1.5em;color:#fff}
.scanbox .btn{align-self:center}
.searchbar.has-cam input{padding-right:120px}
.cambtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);z-index:2}
.searchbar.has-cam .kbd{display:none}
.codefield{display:flex;gap:6px}.codefield input{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@page{margin:0}
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body::before{display:none!important}
